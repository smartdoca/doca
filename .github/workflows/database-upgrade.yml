name: Database upgrade

on:
  pull_request:
    paths:
      - "packages/db/**"
      - "apps/server/src/services/plugin-storage.ts"
      - "apps/server/src/services/plugin-databases.ts"
      - "apps/server/src/plugins/manager.ts"
      - "tests/plugin-managed-storage.test.ts"
      - "tests/plugin-databases.test.ts"
      - "tests/plugin-manager.test.ts"
      - "tests/plugin-credentials.test.ts"
      - "tests/schema-reconciliation*.test.ts"
      - "tests/schema-column-alignment.test.ts"
      - "tests/site-logo.test.ts"
      - "apps/server/src/routes/site-branding.ts"
      - "apps/server/src/services/site-logo.ts"
      - "tests/database.ts"
      - "tests/mcp*.test.ts"
      - "tests/browser-*.test.ts"
      - "apps/server/src/routes/browser-*.ts"
      - "apps/server/src/services/browser-*.ts"
      - "packages/core/src/modules/browser-clipper/**"
      - "apps/server/src/routes/ai-mcp.ts"
      - "apps/server/src/routes/mcp-management.ts"
      - "apps/server/src/services/ai/mcp-*.ts"
      - "tests/editor-package-upgrade.test.ts"
      - "tests/sheet-package-upgrade.test.ts"
      - "tests/knowledge-book*.test.ts"
      - "packages/core/src/modules/knowledge-books/**"
      - "apps/server/src/services/knowledge-book-storage-maintenance.ts"
      - "tests/folder-sharing.test.ts"
      - "tests/resource-handover.test.ts"
      - "packages/core/src/modules/identity/resource-handover.ts"
      - "apps/server/src/routes/resource-handover.ts"
      - "tests/files.test.ts"
      - "tests/file-trash-clear.test.ts"
      - "apps/server/src/services/file-trash-clear.ts"
      - "tests/ai-session-source.test.ts"
      - "tests/community.test.ts"
      - "tests/ai-source-lifecycle.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database-upgrade.yml"
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - "apps/server/src/services/plugin-storage.ts"
      - "apps/server/src/services/plugin-databases.ts"
      - "apps/server/src/plugins/manager.ts"
      - "tests/plugin-managed-storage.test.ts"
      - "tests/plugin-databases.test.ts"
      - "tests/plugin-manager.test.ts"
      - "tests/plugin-credentials.test.ts"
      - "tests/schema-reconciliation*.test.ts"
      - "tests/schema-column-alignment.test.ts"
      - "tests/site-logo.test.ts"
      - "apps/server/src/routes/site-branding.ts"
      - "apps/server/src/services/site-logo.ts"
      - "tests/database.ts"
      - "tests/mcp*.test.ts"
      - "tests/browser-*.test.ts"
      - "apps/server/src/routes/browser-*.ts"
      - "apps/server/src/services/browser-*.ts"
      - "packages/core/src/modules/browser-clipper/**"
      - "apps/server/src/routes/ai-mcp.ts"
      - "apps/server/src/routes/mcp-management.ts"
      - "apps/server/src/services/ai/mcp-*.ts"
      - "tests/editor-package-upgrade.test.ts"
      - "tests/sheet-package-upgrade.test.ts"
      - "tests/knowledge-book*.test.ts"
      - "packages/core/src/modules/knowledge-books/**"
      - "apps/server/src/services/knowledge-book-storage-maintenance.ts"
      - "tests/folder-sharing.test.ts"
      - "tests/resource-handover.test.ts"
      - "packages/core/src/modules/identity/resource-handover.ts"
      - "apps/server/src/routes/resource-handover.ts"
      - "tests/files.test.ts"
      - "tests/file-trash-clear.test.ts"
      - "apps/server/src/services/file-trash-clear.ts"
      - "tests/ai-session-source.test.ts"
      - "tests/community.test.ts"
      - "tests/ai-source-lifecycle.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database-upgrade.yml"

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_DB: doca_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify isolated upgrades and folder sharing
        env:
          DOCA_TEST_POSTGRES: postgres://postgres:isolated-test@127.0.0.1:5432/doca_test
        run: pnpm exec vitest run tests/site-logo.test.ts tests/schema-column-alignment.test.ts tests/schema-reconciliation-postgres.test.ts tests/mcp.test.ts tests/mcp-schema.test.ts tests/folder-sharing.test.ts tests/resource-handover.test.ts tests/files.test.ts tests/knowledge-books.test.ts tests/knowledge-book-payload-storage.test.ts tests/knowledge-book-batch-checkpoints.test.ts tests/knowledge-book-checkpoint-runtime.test.ts tests/knowledge-book-startup-upgrade.test.ts tests/plugin-managed-storage.test.ts tests/plugin-databases.test.ts tests/plugin-postgres-permissions.test.ts tests/plugin-manager.test.ts tests/plugin-credentials.test.ts tests/editor-package-upgrade.test.ts tests/sheet-package-upgrade.test.ts tests/browser-clipper.test.ts tests/browser-clipper-schema.test.ts tests/browser-assistant.test.ts tests/browser-assistant-empty-scope.test.ts tests/file-trash-clear.test.ts tests/ai-session-source.test.ts tests/ai-source-lifecycle.test.ts tests/community.test.ts --maxWorkers=2
