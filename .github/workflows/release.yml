name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  official:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skip GitHub Release for $GITHUB_REF_NAME. Official tags look like v1.2.3."
          fi

  release:
    needs: official
    if: needs.official.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Verify published editor package sources
        run: node scripts/verify-editor-package-sources.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm build
      - name: Pack web assets
        run: |
          mkdir -p artifacts/releases
          archive="artifacts/releases/doca-web-assets-${GITHUB_REF_NAME}.tar.gz"
          tar -C apps/web/dist -czf "$archive" assets
          echo "archive=$archive" >> "$GITHUB_ENV"
      - name: Pack deployment files
        run: |
          node scripts/pack-deployment.mjs
          echo "deployment_archive=artifacts/releases/doca-deploy-${GITHUB_REF_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "deployment_yaml=artifacts/releases/doca-compose-${GITHUB_REF_NAME}.yaml" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="artifacts/releases/release-notes.md"
          {
            cat "docs/releases/${GITHUB_REF_NAME#v}.md"
            echo
            echo "Web assets are attached as \`$(basename "$archive")\`."
            echo "Extract it and publish the \`assets\` directory unchanged."
            echo "Set DOCA_ASSET_BASE to the HTTPS prefix that contains that assets directory, with no trailing slash."
            echo
            echo "Fresh installations can use the attached doca-compose-${GITHUB_REF_NAME}.yaml: edit the origin and generated master key, then run docker compose up -d. Administrator initialization is built into the image. A SHA-256 checksum is attached. Existing installations must preserve their project, volumes and key."
            echo
            echo "Image-only deployment files and initialization instructions are attached as doca-deploy-${GITHUB_REF_NAME}.tar.gz with a SHA-256 checksum."
            echo "Transfer this bundle to servers without GitHub access; no source checkout is needed."
            echo "The container image is separate. Pull the matching smartdoca/doca image or transfer it with docker save/load."
            echo

          } > "$notes"
          gh release create "$GITHUB_REF_NAME" "$archive" "$deployment_archive" "$deployment_archive.sha256" "$deployment_yaml" "$deployment_yaml.sha256" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "$notes"
