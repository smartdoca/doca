packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  leveldown: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@smartdoca/canvas@0.4.1'
  - '@smartdoca/markdown@0.4.2'
  - '@smartdoca/sheet@0.2.0-rc.16'
  - '@smartdoca/slate@0.4.9'
  - '@smartdoca/slate@0.4.10'
  - '@smartdoca/slate@0.4.11'
  - '@smartdoca/slides@0.3.0-alpha.1'
overrides:
  yjs: 13.6.32
  # Leafer plugins share a global Creator registry with the canvas engine.
  # Caret peers must not install a second engine (2.2.x) beside aidcanvas's 2.1.0.
  '@leafer-in/editor': 2.1.0
  '@leafer-in/export': 2.1.0
  '@leafer-in/resize': 2.1.0
  '@leafer-in/interface': 2.1.0
  '@leafer-ui/core': 2.1.0
  '@leafer-ui/draw': 2.1.0
  '@leafer-ui/interface': 2.1.0
  '@leafer/interface': 2.1.0
  'leafer-ui': 2.1.0
