.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

line-flex; align-items: center; justify-content: center; gap: 8px; padding: 0; border: 0; background: transparent; cursor: default; }\na { text-decoration: none; }\n.glyph { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }\n.app-shell { height: 100dvh; display: grid; grid-template-columns: 254px minmax(0, 1fr); overflow: hidden; }\n.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 12px 10px 8px; background: var(--sidebar); border-right: 1px solid var(--line); }\n.library-brand-row { display: flex; align-items: center; gap: 4px; padding-bottom: 12px; flex: none; }\n.brand { display: flex; flex: 1; align-items: center; gap: 8px; padding: 0 6px; font-size: 16px; font-weight: 650; }\n.brand-symbol { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.icon { width: 28px; height: 28px; color: var(--muted); flex: none; }\n.sidebar-search { display: flex; height: 38px; min-height: 38px; padding: 7px 10px; margin: 0 2px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--control-radius); color: var(--muted); }\n.sidebar-search span { flex: 1; text-align: left; }\n.sidebar-search kbd { font-size: 10px; font-family: inherit; }\n.sidebar nav { display: grid; gap: 4px; flex: none; }\n.sidebar nav > a, .sidebar nav > button { display: flex; height: 40px; min-height: 40px; align-items: center; justify-content: flex-start; padding: 8px 12px; gap: 10px; font-size: 15px; font-weight: 500; color: var(--muted); border-radius: var(--control-radius); }\n.sidebar nav > .create, .sidebar nav > .pinned { border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--button-shadow); }\n.sidebar nav > .create { margin-bottom: 6px; }\n.create-plus { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.create-plus svg { width: 14px; height: 14px; }\n.sidebar nav > .pinned { margin-bottom: 10px; }\n.pinned .glyph { color: var(--accent); }\n.sidebar nav > .active { color: var(--accent); background: var(--selected); font-weight: 600; }\n.sidebar nav > .assistant { color: var(--accent); font-weight: 600; }\n.sidebar nav > .trash { height: 52px; min-height: 52px; margin-top: 8px; padding-top: 19px; border-top: 1px solid var(--line); border-radius: 0; }\n.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }\n.topbar { height: 56px; min-height: 56px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; gap: 18px; flex: none; }\n.topbar .glyph { width: 20px; height: 20px; }\n.topbar button { color: var(--text); }\n.topbar .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--selected); color: var(--accent); font-weight: 600; }\n.main-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-gutter: stable; }\n.workspace-home { width: 100%; max-width: 1320px; min-width: 0; margin: 0 auto; padding: 32px 36px 64px; }\n.workspace-welcome { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }\n.workspace-welcome p { color: var(--muted); font-size: 13px; line-height: 20px; margin: 0 0 10px; }\n.workspace-welcome h1 { font-family: var(--display-font); font-size: 26px; line-height: 36px; margin: 0 0 8px; font-weight: var(--display-weight); }\n.workspace-welcome span { color: var(--muted); font-size: 14px; line-height: 21px; }\n.workspace-columns { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }\n.workspace-columns > * { min-width: 0; }\n.workspace-panel { background: var(--surface); border: 1px solid var(--panel-line); border-radius: var(--panel-radius); overflow: hidden; padding: 20px; box-shadow: var(--panel-shadow); }\n.workspace-panel header h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; font-size: 16px; line-height: 24px; font-weight: 600; }\n.home-tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin: 4px 0 0; overflow-x: auto; white-space: nowrap; }\n.home-tabs button { padding: 14px 0; font-size: 14px; line-height: 21px; position: relative; color: var(--muted); }\n.home-tabs .active { color: var(--accent); font-weight: 600; }\n.home-tabs .active:after { content: ''; position: absolute; height: 3px; background: var(--accent); bottom: 0; left: 0; right: 0; border-radius: 2px; }\n.workspace-recent > div { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--line); }\n.file-glyph { width: 30px; height: 32px; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: var(--control-radius); background: var(--doc-bg); color: var(--doc-ink); }\n.file-glyph.library { background: var(--library-bg); color: var(--library-ink); }\n.file-glyph.file { background: var(--selected); color: var(--muted); }\n.file-glyph .glyph { width: 20px; height: 20px; }\n.recent-title { min-width: 0; flex: 1; }\n.recent-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 21px; font-weight: 500; }\n.recent-title small { display: flex; gap: 10px; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 18px; }\n.workspace-recent .icon { width: 28px; height: 28px; }\n.workspace-recent .icon .glyph { width: 16px; height: 16px; }\n.workspace-ai { display: block; position: relative; background: var(--ai-bg); border: 1px solid var(--ai-line); border-radius: var(--panel-radius); padding: 22px; color: var(--accent); margin-bottom: 20px; }\n.workspace-ai > .glyph:first-child { width: 24px; height: 24px; }\n.workspace-ai h2 { font-size: 18px; line-height: 27px; margin: 14px 0 8px; font-weight: 650; }\n.workspace-ai p { font-size: 13px; line-height: 1.7; margin: 0; }\n.workspace-ai > .arrow { width: 20px; height: 20px; position: absolute; right: 20px; top: 24px; }\n.workspace-todos h3 { display: flex; justify-content: space-between; font-size: 13px; line-height: 20px; margin: 22px 0 10px; font-weight: 600; }\n.workspace-todos h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }\n.workspace-todos p { font-size: 13px; line-height: 20px; margin: 13px 0; color: var(--muted); }\n.workspace-todos .task { display: flex; justify-content: flex-end; padding: 10px 0; line-height: 20px; }\n.workspace-todos .task .glyph { width: 16px; height: 16px; }\n@media (max-width: 950px) {\n  .workspace-columns { grid-template-columns: 1fr; }\n  .workspace-columns > aside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n  .workspace-home { padding: 24px 18px; }\n}\n@media (max-width: 700px) {\n  .app-shell { grid-template-columns: 64px minmax(0, 1fr); }\n  .sidebar { padding: 12px 6px 8px; }\n  .library-brand-row { justify-content: center; }\n  .brand { flex: 0; padding: 0; }\n  .brand > span:last-child, .library-brand-row > button, .sidebar-search span, .sidebar-search kbd, .sidebar nav > a > span, .sidebar nav > button > span:last-child { display: none; }\n  .sidebar-search, .sidebar nav > a, .sidebar nav > button { justify-content: center; padding-left: 0; padding-right: 0; }\n  .sidebar nav .create-plus { display: inline-flex; }\n}\n@media (max-width: 600px) {\n  .workspace-columns > aside { grid-template-columns: 1fr; }\n  .home-tabs { gap: 18px; }\n}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"app-shell\">\n  \u003caside class=\"sidebar\">\n    \u003cdiv class=\"library-brand-row\">\u003ca class=\"brand\" href=\"#\">\u003cspan class=\"brand-symbol\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 ;\n  --display-weight: 700;\n  --ai-bg: #DEE0DF;\n  --ai-line: #DDE0DD;\n  --doc-bg: #25282A;\n  --doc-ink: #FFFFFF;\n  --library-bg: #DEE0DF;\n  --library-ink: #25282A;\n  --button-shadow: none;\n  --panel-shadow: none;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; overflow: hidden; }\nbody { color: var(--text); background: var(--bg); font-family: var(--body-font); font-size: 14px; line-height: 1.5; }\nbutton, a { font: inherit; color: inherit; }\nbutton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0; border: 0; background: transparent; cursor: default; }\na { text-decoration: none; }\n.glyph { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }\n.app-shell { height: 100dvh; display: grid; grid-template-columns: 254px minmax(0, 1fr); overflow: hidden; }\n.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 12px 10px 8px; background: var(--sidebar); border-right: 1px solid var(--line); }\n.library-brand-row { display: flex; align-items: center; gap: 4px; padding-bottom: 12px; flex: none; }\n.brand { display: flex; flex: 1; align-items: center; gap: 8px; padding: 0 6px; font-size: 16px; font-weight: 650; }\n.brand-symbol { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.icon { width: 28px; height: 28px; color: var(--muted); flex: none; }\n.sidebar-search { display: flex; height: 38px; min-height: 38px; padding: 7px 10px; margin: 0 2px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--control-radius); color: var(--muted); }\n.sidebar-search span { flex: 1; text-align: left; }\n.sidebar-search kbd { font-size: 10px; font-family: inherit; }\n.sidebar nav { display: grid; gap: 4px; flex: none; }\n.sidebar nav > a, .sidebar nav > button { display: flex; height: 40px; min-height: 40px; align-items: center; justify-content: flex-start; padding: 8px 12px; gap: 10px; font-size: 15px; font-weight: 500; color: var(--muted); border-radius: var(--control-radius); }\n.sidebar nav > .create, .sidebar nav > .pinned { border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--button-shadow); }\n.sidebar nav > .create { margin-bottom: 6px; }\n.create-plus { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.create-plus svg { width: 14px; height: 14px; }\n.sidebar nav > .pinned { margin-bottom: 10px; }\n.pinned .glyph { color: var(--accent); }\n.sidebar nav > .active { color: var(--accent); background: var(--selected); font-weight: 600; }\n.sidebar nav > .assistant { color: var(--accent); font-weight: 600; }\n.sidebar nav > .trash { height: 52px; min-height: 52px; margin-top: 8px; padding-top: 19px; border-top: 1px solid var(--line); border-radius: 0; }\n.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }\n.topbar { height: 56px; min-height: 56px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; gap: 18px; flex: none; }\n.topbar .glyph { width: 20px; height: 20px; }\n.topbar button { color: var(--text); }\n.topbar .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--selected); color: var(--accent); font-weight: 600; }\n.main-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-gutter: stable; }\n.workspace-home { width: 100%; max-width: 1320px; min-width: 0; margin: 0 auto; padding: 32px 36px 64px; }\n.workspace-welcome { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }\n.workspace-welcome p { color: var(--muted); font-size: 13px; line-height: 20px; margin: 0 0 10px; }\n.workspace-welcome h1 { font-family: var(--display-font); font-size: 26px; line-height: 36px; margin: 0 0 8px; font-weight: var(--display-weight); }\n.workspace-welcome span { color: var(--muted); font-size: 14px; line-height: 21px; }\n.workspace-columns { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }\n.workspace-columns > * { min-width: 0; }\n.workspace-panel { background: var(--surface); border: 1px solid var(--panel-line); border-radius: var(--panel-radius); overflow: hidden; padding: 20px; box-shadow: var(--panel-shadow); }\n.workspace-panel header h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; font-size: 16px; line-height: 24px; font-weight: 600; }\n.home-tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin: 4px 0 0; overflow-x: auto; white-space: nowrap; }\n.home-tabs button { padding: 14px 0; font-size: 14px; line-height: 21px; position: relative; color: var(--muted); }\n.home-tabs .active { color: var(--accent); font-weight: 600; }\n.home-tabs .active:after { content: ''; position: absolute; height: 3px; background: var(--accent); bottom: 0; left: 0; right: 0; border-radius: 2px; }\n.workspace-recent > div { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--line); }\n.file-glyph { width: 30px; height: 32px; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: var(--control-radius); background: var(--doc-bg); color: var(--doc-ink); }\n.file-glyph.library { background: var(--library-bg); color: var(--library-ink); }\n.file-glyph.file { background: var(--selected); color: var(--muted); }\n.file-glyph .glyph { width: 20px; height: 20px; }\n.recent-title { min-width: 0; flex: 1; }\n.recent-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 21px; font-weight: 500; }\n.recent-title small { display: flex; gap: 10px; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 18px; }\n.workspace-recent .icon { width: 28px; height: 28px; }\n.workspace-recent .icon .glyph { width: 16px; height: 16px; }\n.workspace-ai { display: block; position: relative; background: var(--ai-bg); border: 1px solid var(--ai-line); border-radius: var(--panel-radius); padding: 22px; color: var(--accent); margin-bottom: 20px; }\n.workspace-ai > .glyph:first-child { width: 24px; height: 24px; }\n.workspace-ai h2 { font-size: 18px; line-height: 27px; margin: 14px 0 8px; font-weight: 650; }\n.workspace-ai p { font-size: 13px; line-height: 1.7; margin: 0; }\n.workspace-ai > .arrow { width: 20px; height: 20px; position: absolute; right: 20px; top: 24px; }\n.workspace-todos h3 { display: flex; justify-content: space-between; font-size: 13px; line-height: 20px; margin: 22px 0 10px; font-weight: 600; }\n.workspace-todos h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }\n.workspace-todos p { font-size: 13px; line-height: 20px; margin: 13px 0; color: var(--muted); }\n.workspace-todos .task { display: flex; justify-content: flex-end; padding: 10px 0; line-height: 20px; }\n.workspace-todos .task .glyph { width: 16px; height: 16px; }\n@media (max-width: 950px) {\n  .workspace-columns { grid-template-columns: 1fr; }\n  .workspace-columns > aside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n  .workspace-home { padding: 24px 18px; }\n}\n@media (max-width: 700px) {\n  .app-shell { grid-template-columns: 64px minmax(0, 1fr); }\n  .sidebar { padding: 12px 6px 8px; }\n  .library-brand-row { justify-content: center; }\n  .brand { flex: 0; padding: 0; }\n  .brand > span:last-child, .library-brand-row > button, .sidebar-search span, .sidebar-search kbd, .sidebar nav > a > span, .sidebar nav > button > span:last-child { display: none; }\n  .sidebar-search, .sidebar nav > a, .sidebar nav > button { justify-content: cent \"M7 17 17 7M7 7h10v10\"/>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n        \u003caside>\u003ca class=\"workspace-ai\" href=\"#\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7zM20 2v4m-2-2h4\"/>\u003c/svg>\u003ch2>AI 助手\u003c/h2>\u003cp>查找资料、梳理思路，让 AI 帮你继续推进工作。\u003c/p>\u003csvg class=\"glyph arrow\" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 17 17 7M7 7h10v10\"/>\u003c/svg>\u003c/a>\n          \u003csection class=\"workspace-panel workspace-todos\">\u003cheader>\u003ch2>\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"m3 5 2 2 3-3m3 2h10M3 12h4m4 0h10M3 18h4m4 0h10\"/>\u003c/svg>待我处理\u003c/h2>\u003c/header>\u003ch3>待处理工单\u003cspan>0\u003c/span>\u003c/h3>\u003cp>暂无待处理事项\u003c/p>\u003ch3>人工待办\u003cspan>1\u003c/span>\u003c/h3>\u003ca class=\"task\" href=\"#\" aria-label=\"打开人工待办\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 17 17 7M7 7h10v10\"/>\u003c/svg>\u003c/a>\u003c/section>\n        \u003c/aside>\n      \u003c/div>\n    \u003c/section>\u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003c/body>\u003c/html>", "sourceLabel": "fixed-graphite-archive.html", "baseline": false, "interactive": false}, {"id": "night-desk", "name": "夜航工作台", "concept": "像夜间点亮的工作桌：炭灰压低背景，铜色把创作动作从内容里提出来。", "typography": "标题 \"Avenir Next\", \"PingFang SC\", sans-serif · 正文 \"PingFang SC\", sans-serif · 字号与现状一致", "palette": ["#20272A", "#2C3539", "#EEF1EB", "#DEA77F"], "traits": ["保留现有布局", "相同控件位置与密度", "炭灰深色", "铜色动作", "6px 圆角"], "kind": "html", "content": "\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>Doca · 夜航工作台\u003c/title>\u003cstyle>:root {\n  --bg: #20272A;\n  --surface: #2C3539;\n  --text: #EEF1EB;\n  --muted: #A4B0AB;\n  --accent: #DEA77F;\n  --accent-text: #20272A;\n  --line: #4B585A;\n  --sidebar: #2A2E2F;\n  --selected: #3E3B38;\n  --control-radius: 6px;\n  --panel-radius: 6px;\n  --panel-line: #4B585A;\n  --body-font: \"PingFang SC\", sans-serif;\n  --display-font: \"Avenir Next\", \"PingFang SC\", sans-serif;\n  --display-weight: 600;\n  --ai-bg: #3E3B38;\n  --ai-line: #4B585A;\n  --doc-bg: #DEA77F;\n  --doc-ink: #20272A;\n  --library-bg: #3E3B38;\n  --library-ink: #DEA77F;\n  --button-shadow: none;\n  --panel-shadow: none;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; overflow: hidden; }\nbody { color: var(--text); background: var(--bg); font-family: var(--body-font); font-size: 14px; line-height: 1.5; }\nbutton, a { font: inherit; color: inherit; }\nbutton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0; border: 0; background: transparent; cursor: default; }\na { text-decoration: none; }\n.glyph { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }\n.app-shell { height: 100dvh; display: grid; grid-template-columns: 254px minmax(0, 1fr); overflow: hidden; }\n.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 12px 10px 8px; background: var(--sidebar); border-right: 1px solid var(--line); }\n.library-brand-row { display: flex; align-items: center; gap: 4px; padding-bottom: 12px; flex: none; }\n.brand { display: flex; flex: 1; align-items: center; gap: 8px; padding: 0 6px; font-size: 16px; font-weight: 650; }\n.brand-symbol { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.icon { width: 28px; height: 28px; color: var(--muted); flex: none; }\n.sidebar-search { display: flex; height: 38px; min-height: 38px; padding: 7px 10px; margin: 0 2px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--control-radius); color: var(--muted); }\n.sidebar-search span { flex: 1; text-align: left; }\n.sidebar-search kbd { font-size: 10px; font-family: inherit; }\n.sidebar nav { display: grid; gap: 4px; flex: none; }\n.sidebar nav > a, .sidebar nav > button { display: flex; height: 40px; min-height: 40px; align-items: center; justify-content: flex-start; padding: 8px 12px; gap: 10px; font-size: 15px; font-weight: 500; color: var(--muted); border-radius: var(--control-radius); }\n.sidebar nav > .create, .sidebar nav > .pinned { border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--button-shadow); }\n.sidebar nav > .create { margin-bottom: 6px; }\n.create-plus { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.create-plus svg { width: 14px; height: 14px; }\n.sidebar nav > .pinned { margin-bottom: 10px; }\n.pinned .glyph { color: var(--accent); }\n.sidebar nav > .active { color: var(--accent); background: var(--selected); font-weight: 600; }\n.sidebar nav > .assistant { color: var(--accent); font-weight: 600; }\n.sidebar nav > .trash { height: 52px; min-height: 52px; margin-top: 8px; padding-top: 19px; border-top: 1px solid var(--line); border-radius: 0; }\n.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }\n.topbar { height: 56px; min-height: 56px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; gap: 18px; flex: none; }\n.topbar .glyph { width: 20px; height: 20px; }\n.topbar button { color: var(--text); }\n.topbar .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--selected); color: var(--accent); font-weight: 600; }\n.main-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-gutter: stable; }\n.workspace-home { width: 100%; max-width: 1320px; min-width: 0; margin: 0 auto; padding: 32px 36px 64px; }\n.workspace-welcome { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }\n.workspace-welcome p { color: var(--muted); font-size: 13px; line-height: 20px; margin: 0 0 10px; }\n.workspace-welcome h1 { font-family: var(--display-font); font-size: 26px; line-height: 36px; margin: 0 0 8px; font-weight: var(--display-weight); }\n.workspace-welcome span { color: var(--muted); font-size: 14px; line-height: 21px; }\n.workspace-columns { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }\n.workspace-columns > * { min-width: 0; }\n.workspace-panel { background: var(--surface); border: 1px solid var(--panel-line); border-radius: var(--panel-radius); overflow: hidden; padding: 20px; box-shadow: var(--panel-shadow); }\n.workspace-panel header h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; font-size: 16px; line-height: 24px; font-weight: 600; }\n.home-tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin: 4px 0 0; overflow-x: auto; white-space: nowrap; }\n.home-tabs button { padding: 14px 0; font-size: 14px; line-height: 21px; position: relative; color: var(--muted); }\n.home-tabs .active { color: var(--accent); font-weight: 600; }\n.home-tabs .active:after { content: ''; position: absolute; height: 3px; background: var(--accent); bottom: 0; left: 0; right: 0; border-radius: 2px; }\n.workspace-recent > div { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--line); }\n.file-glyph { width: 30px; height: 32px; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: var(--control-radius); background: var(--doc-bg); color: var(--doc-ink); }\n.file-glyph.library { background: var(--library-bg); color: var(--library-ink); }\n.file-glyph.file { background: var(--selected); color: var(--muted); }\n.file-glyph .glyph { width: 20px; height: 20px; }\n.recent-title { min-width: 0; flex: 1; }\n.recent-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 21px; font-weight: 500; }\n.recent-title small { display: flex; gap: 10px; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 18px; }\n.workspace-recent .icon { width: 28px; height: 28px; }\n.workspace-recent .icon .glyph { width: 16px; height: 16px; }\n.workspace-ai { display: block; position: relative; background: var(--ai-bg); border: 1px solid var(--ai-line); border-radius: var(--panel-radius); padding: 22px; color: var(--accent); margin-bottom: 20px; }\n.workspace-ai > .glyph:first-child { width: 24px; height: 24px; }\n.workspace-ai h2 { font-size: 18px; line-height: 27px; margin: 14px 0 8px; font-weight: 650; }\n.workspace-ai p { font-size: 13px; line-height: 1.7; margin: 0; }\n.workspace-ai > .arrow { width: 20px; height: 20px; position: absolute; right: 20px; top: 24px; }\n.workspace-todos h3 { display: flex; justify-content: space-between; font-size: 13px; line-height: 20px; margin: 22px 0 10px; font-weight: 600; }\n.workspace-todos h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }\n.workspace-todos p { font-size: 13px; line-height: 20px; margin: 13px 0; color: var(--muted); }\n.workspace-todos .task { display: flex; justify-content: flex-end; padding: 10px 0; line-height: 20px; }\n.workspace-todos .task .glyph { width: 16px; height: 16px; }\n@media (max-width: 950px) {\n  .workspace-columns { grid-template-columns: 1fr; }\n  .workspace-columns > aside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n  .workspace-home { padding: 24px 18px; }\n}\n@media (max-width: 700px) {\n  .app-shell { grid-template-columns: 64px minmax(0, 1fr); }\n  .sidebar { padding: 12px 6px 8px; }\n  .library-brand-row { justify-content: center; }\n  .brand { flex: 0; padding: 0; }\n  .brand > span:last-child, .library-brand-row > button, .sidebar-search span, .sidebar-search kbd, .sidebar nav > a > span, .sidebar nav > button > span:last-child { display: none; }\n  .sidebar-search, .sidebar nav > a, .sidebar nav > button { justify-content: center; padding-left: 0; padding-right: 0; }\n  .sidebar nav .create-plus { display: inline-flex; }\n}\n@media (max-width: 600px) {\n  .workspace-columns > aside { grid-template-columns: 1fr; }\n  .home-tabs { gap: 18px; }\n}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"app-shell\">\n  \u003caside class=\"sidebar\">\n    \u003cdiv class=\"library-brand-row\">\u003ca class=\"brand\" href=\"#\">\u003cspan class=\"brand-symbol\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 7v14m0-14C9 4 5 4 2 5v15c3-1 7-1 10 1m0-14c3-3 7-3 10-2v15c-3-1-7-1-10 1\"/>\u003c/svg>\u003c/span>\u003cspan>Doca\u003c/span>\u003c/a>\u003cbutton class=\"icon\" aria-label=\"收起侧边导航\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/>\u003cpath d=\"M9 3v18\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003cbutton class=\"sidebar-search\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"10.5\" cy=\"10.5\" r=\"7.5\"/>\u003cpath d=\"m16 16 5 5\"/>\u003c/svg>\u003cspan>搜索\u003c/span>\u003ckbd>⌘ K\u003c/kbd>\u003c/button>\n    \u003cnav aria-label=\"主导航\">\n      \u003cbutton class=\"create\">\u003cspan class=\"create-plus\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg>\u003c/span>\u003cspan>创作\u003c/span>\u003c/button>\n      \u003cbutton class=\"pinned\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M16 3H8m1 0v5l-3 4v3h12v-3l-3-4V3m-3 12v7\"/>\u003c/svg>\u003cspan>置顶\u003c/span>\u003c/button>\n      \u003ca href=\"#\" class=\"active\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z\"/>\u003cpath d=\"M9 21v-8h6v8\"/>\u003c/svg>\u003cspan>首页\u003c/span>\u003c/a>\u003ca href=\"#\" class=\"assistant\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7zM20 2v4m-2-2h4\"/>\u003c/svg>\u003cspan>AI 助手\u003c/span>\u003c/a>\u003ca href=\"#\" class=\"\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h6\"/>\u003c/svg>\u003cspan>文档\u003c/span>\u003c/a>\u003ca href=\"#\" class=\"\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 7v14m0-14C9 4 5 4 2 5v15c3-1 7-1 10 1m0-14c3-3 7-3 10-2v15c-3-1-7-1-10 1\"/>\u003c/svg>\u003cspan>知识库\u003c/span>\u003c/a>\u003ca href=\"#\" class=\"\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 7v14m0-14C9 4 5 4 2 5v15c3-1 7-1 10 1m0-14c3-3 7-3 10-2v15c-3-1-7-1-10 1\"/>\u003c/svg>\u003cspan>知识册\u003c/span>\u003c/a>\u003ca href=\"#\" class=\"\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 10h18\"/>\u003c/svg>\u003cspan>文件夹\u003c/span>\u003c/a>\u003ca href=\"#\" class=\"\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.9\"/>\u003ccircle cx=\"9\" cy=\"7\" r=\"4\"/>\u003cpath d=\"M16 3.1a4 4 0 0 1 0 7.8\"/>\u003c/svg>\u003cspan>共享文件夹\u003c/span>\u003c/a>\u003ca href=\"#\" class=\"\">\u003csvg class=\"glyp hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h6\"/>\u003c/svg>\u003c/span>\u003ca class=\"recent-title\" href=\"#\" title=\"image.png\">\u003cstrong>image.png\u003c/strong>\u003csmall>\u003cspan>文件\u003c/span>\u003cspan>今天 14:12\u003c/span>\u003c/small>\u003c/a>\u003ca href=\"#\" class=\"icon\" aria-label=\"打开image.png\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 17 17 7M7 7h10v10\"/>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n        \u003caside>\u003ca class=\"workspace-ai\" href=\"#\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7zM20 2v4m-2-2h4\"/>\u003c/svg>\u003ch2>AI 助手\u003c/h2>\u003cp>查找资料、梳理思路，让 AI 帮你继续推进工作。\u003c/p>\u003csvg class=\"glyph arrow\" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 17 17 7M7 7h10v10\"/>\u003c/svg>\u003c/a>\n          \u003csection class=\"workspace-panel workspace-todos\">\u003cheader>\u003ch2>\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"m3 5 2 2 3-3m3 2h10M3 12h4m4 0h10M3 18h4m4 0h10\"/>\u003c/svg>待我处理\u003c/h2>\u003c/header>\u003ch3>待处理工单\u003cspan>0\u003c/span>\u003c/h3>\u003cp>暂无待处理事项\u003c/p>\u003ch3>人工待办\u003cspan>1\u003c/span>\u003c/h3>\u003ca class=\"task\" href=\"#\" aria-label=\"打开人工待办\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 17 17 7M7 7h10v10\"/>\u003c/svg>\u003c/a>\u003c/section>\n        \u003c/aside>\n      \u003c/div>\n    \u003c/section>\u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003c/body>\u003c/html>", "sourceLabel": "fixed-night-desk.html", "baseline": false, "interactive": false}, {"id": "celadon-studio", "name": "青瓷创作台", "concept": "像一张清透的创作桌：青白底色、青瓷绿和柔软控件，让内容容易亲近。", "typography": "标题 \"Avenir Next\", \"PingFang SC\", sans-serif · 正文 \"Helvetica Neue\", \"PingFang SC\", sans-serif · 字号与现状一致", "palette": ["#EDF5F3", "#FFFFFF", "#213E3B", "#16716C"], "traits": ["保留现有布局", "相同控件位置与密度", "青白底色", "青瓷绿强调", "18px 圆角"], "kind": "html", "content": "\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>Doca · 青瓷创作台\u003c/title>\u003cstyle>:root {\n  --bg: #EDF5F3;\n  --surface: #FFFFFF;\n  --text: #213E3B;\n  --muted: #4F6862;\n  --accent: #16716C;\n  --accent-text: #FFFFFF;\n  --line: #D3E3DE;\n  --sidebar: #E1EEEC;\n  --selected: #D8E8E6;\n  --control-radius: 8px;\n  --panel-radius: 18px;\n  --panel-line: #D3E3DE;\n  --body-font: \"Helvetica Neue\", \"PingFang SC\", sans-serif;\n  --display-font: \"Avenir Next\", \"PingFang SC\", sans-serif;\n  --display-weight: 500;\n  --ai-bg: #D8E8E6;\n  --ai-line: #D3E3DE;\n  --doc-bg: #16716C;\n  --doc-ink: #FFFFFF;\n  --library-bg: #D8E8E6;\n  --library-ink: #16716C;\n  --button-shadow: 0 1px 3px #213E3B0A;\n  --panel-shadow: 0 3px 12px #213E3B08;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; overflow: hidden; }\nbody { color: var(--text); background: var(--bg); font-family: var(--body-font); font-size: 14px; line-height: 1.5; }\nbutton, a { font: inherit; color: inherit; }\nbutton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0; border: 0; background: transparent; cursor: default; }\na { text-decoration: none; }\n.glyph { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }\n.app-shell { height: 100dvh; display: grid; grid-template-columns: 254px minmax(0, 1fr); overflow: hidden; }\n.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 12px 10px 8px; background: var(--sidebar); border-right: 1px solid var(--line); }\n.library-brand-row { display: flex; align-items: center; gap: 4px; padding-bottom: 12px; flex: none; }\n.brand { display: flex; flex: 1; align-items: center; gap: 8px; padding: 0 6px; font-size: 16px; font-weight: 650; }\n.brand-symbol { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.icon { width: 28px; height: 28px; color: var(--muted); flex: none; }\n.sidebar-search { display: flex; height: 38px; min-height: 38px; padding: 7px 10px; margin: 0 2px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--control-radius); color: var(--muted); }\n.sidebar-search span { flex: 1; text-align: left; }\n.sidebar-search kbd { font-size: 10px; font-family: inherit; }\n.sidebar nav { display: grid; gap: 4px; flex: none; }\n.sidebar nav > a, .sidebar nav > button { display: flex; height: 40px; min-height: 40px; align-items: center; justify-content: flex-start; padding: 8px 12px; gap: 10px; font-size: 15px; font-weight: 500; color: var(--muted); border-radius: var(--control-radius); }\n.sidebar nav > .create, .sidebar nav > .pinned { border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--button-shadow); }\n.sidebar nav > .create { margin-bottom: 6px; }\n.create-plus { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.create-plus svg { width: 14px; height: 14px; }\n.sidebar nav > .pinned { margin-bottom: 10px; }\n.pinned .glyph { color: var(--accent); }\n.sidebar nav > .active { color: var(--accent); background: var(--selected); font-weight: 600; }\n.sidebar nav > .assistant { color: var(--accent); font-weight: 600; }\n.sidebar nav > .trash { height: 52px; min-height: 52px; margin-top: 8px; padding-top: 19px; border-top: 1px solid var(--line); border-radius: 0; }\n.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }\n.topbar { height: 56px; min-height: 56px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; gap: 18px; flex: none; }\n.topbar .glyph { width: 20px; height: 20px; }\n.topbar button { color: var(--text); }\n.topbar .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--selected); color: var(--accent); font-weight: 600; }\n.main-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-gutter: stable; }\n.workspace-home { width: 100%; max-width: 1320px; min-width: 0; margin: 0 auto; padding: 32px 36px 64px; }\n.workspace-welcome { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }\n.workspace-welcome p { color: var(--muted); font-size: 13px; line-height: 20px; margin: 0 0 10px; }\n.workspace-welcome h1 { font-family: var(--display-font); font-size: 26px; line-height: 36px; margin: 0 0 8px; font-weight: var(--display-weight); }\n.workspace-welcome span { color: var(--muted); font-size: 14px; line-height: 21px; }\n.workspace-columns { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }\n.workspace-columns > * { min-width: 0; }\n.workspace-panel { background: var(--surface); border: 1px solid var(--panel-line); border-radius: var(--panel-radius); overflow: hidden; padding: 20px; box-shadow: var(--panel-shadow); }\n.workspace-panel header h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; font-size: 16px; line-height: 24px; font-weight: 600; }\n.home-tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin: 4px 0 0; overflow-x: auto; white-space: nowrap; }\n.home-tabs button { padding: 14px 0; font-size: 14px; line-height: 21px; position: relative; color: var(--muted); }\n.home-tabs .active { color: var(--accent); font-weight: 600; }\n.home-tabs .active:after { content: ''; position: absolute; height: 3px; background: var(--accent); bottom: 0; left: 0; right: 0; border-radius: 2px; }\n.workspace-recent > div { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--line); }\n.file-glyph { width: 30px; height: 32px; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: var(--control-radius); background: var(--doc-bg); color: var(--doc-ink); }\n.file-glyph.library { background: var(--library-bg); color: var(--library-ink); }\n.file-glyph.file { background: var(--selected); color: var(--muted); }\n.file-glyph .glyph { width: 20px; height: 20px; }\n.recent-title { min-width: 0; flex: 1; }\n.recent-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 21px; font-weight: 500; }\n.recent-title small { display: flex; gap: 10px; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 18px; }\n.workspace-recent .icon { width: 28px; height: 28px; }\n.workspace-recent .icon .glyph { width: 16px; height: 16px; }\n.workspace-ai { display: block; position: relative; background: var(--ai-bg); border: 1px solid var(--ai-line); border-radius: var(--panel-radius); padding: 22px; color: var(--accent); margin-bottom: 20px; }\n.workspace-ai > .glyph:first-child { width: 24px; height: 24px; }\n.workspace-ai h2 { font-size: 18px; line-height: 27px; margin: 14px 0 8px; font-weight: 650; }\n.workspace-ai p { font-size: 13px; line-height: 1.7; margin: 0; }\n.workspace-ai > .arrow { width: 20px; height: 20px; position: absolute; right: 20px; top: 24px; }\n.workspace-todos h3 { display: flex; justify-content: space-between; font-size: 13px; line-height: 20px; margin: 22px 0 10px; font-weight: 600; }\n.workspace-todos  inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0; border: 0; background: transparent; cursor: default; }\na { text-decoration: none; }\n.glyph { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }\n.app-shell { height: 100dvh; display: grid; grid-template-columns: 254px minmax(0, 1fr); overflow: hidden; }\n.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 12px 10px 8px; background: var(--sidebar); border-right: 1px solid var(--line); }\n.library-brand-row { display: flex; align-items: center; gap: 4px; padding-bottom: 12px; flex: none; }\n.brand { display: flex; flex: 1; align-items: center; gap: 8px; padding: 0 6px; font-size: 16px; font-weight: 650; }\n.brand-symbol { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.icon { width: 28px; height: 28px; color: var(--muted); flex: none; }\n.sidebar-search { display: flex; height: 38px; min-height: 38px; padding: 7px 10px; margin: 0 2px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--control-radius); color: var(--muted); }\n.sidebar-search span { flex: 1; text-align: left; }\n.sidebar-search kbd { font-size: 10px; font-family: inherit; }\n.sidebar nav { display: grid; gap: 4px; flex: none; }\n.sidebar nav > a, .sidebar nav > button { display: flex; height: 40px; min-height: 40px; align-items: center; justify-content: flex-start; padding: 8px 12px; gap: 10px; font-size: 15px; font-weight: 500; color: var(--muted); border-radius: var(--control-radius); }\n.sidebar nav > .create, .sidebar nav > .pinned { border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--button-shadow); }\n.sidebar nav > .create { margin-bottom: 6px; }\n.create-plus { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); border-radius: var(--control-radius); }\n.create-plus svg { width: 14px; height: 14px; }\n.sidebar nav > .pinned { margin-bottom: 10px; }\n.pinned .glyph { color: var(--accent); }\n.sidebar nav > .active { color: var(--accent); background: var(--selected); font-weight: 600; }\n.sidebar nav > .assistant { color: var(--accent); font-weight: 600; }\n.sidebar nav > .trash { height: 52px; min-height: 52px; margin-top: 8px; padding-top: 19px; border-top: 1px solid var(--line); border-radius: 0; }\n.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }\n.topbar { height: 56px; min-height: 56px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; gap: 18px; flex: none; }\n.topbar .glyph { width: 20px; height: 20px; }\n.topbar button { color: var(--text); }\n.topbar .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--selected); color: var(--accent); font-weight: 600; }\n.main-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-gutter: stable; }\n.workspace-home { width: 100%; max-width: 1320px; min-width: 0; margin: 0 auto; padding: 32px 36px 64px; }\n.workspace-welcome { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }\n.workspace-welcome p { color: var(--muted); font-size: 13px; line-height: 20px; margin: 0 0 10px; }\n.workspace-welcome h1 { font-family: var(--display-font); font-size: 26px; line-height: 36px; margin: 0 0 8px; font-weight: var(--display-weight); }\n.workspace-welcome span { color: var(--muted); font-size: 14px; line-height: 21px; }\n.workspace-columns { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }\n.workspace-columns > * { min-width: 0; }\n.workspace-panel { background: var(--surface); border: 1px solid var(--panel-line); border-radius: var(--panel-radius); overflow: hidden; padding: 20px; box-shadow: var(--panel-shadow); }\n.workspace-panel header h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; font-size: 16px; line-height: 24px; font-weight: 600; }\n.home-tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin: 4px 0 0; overflow-x: auto; white-space: nowrap; }\n.home-tabs button { padding: 14px 0; font-size: 14px; line-height: 21px; position: relative; color: var(--muted); }\n.home-tabs .active { color: var(--accent); font-weight: 600; }\n.home-tabs .active:after { content: ''; position: absolute; height: 3px; background: var(--accent); bottom: 0; left: 0; right: 0; border-radius: 2px; }\n.workspace-recent > div { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--line); }\n.file-glyph { width: 30px; height: 32px; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: var(--control-radius); background: var(--doc-bg); color: var(--doc-ink); }\n.file-glyph.library { background: var(--library-bg); color: var(--library-ink); }\n.file-glyph.file { background: var(--selected); color: var(--muted); }\n.file-glyph .glyph { width: 20px; height: 20px; }\n.recent-title { min-width: 0; flex: 1; }\n.recent-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 21px; font-weight: 500; }\n.recent-title small { display: flex; gap: 10px; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 18px; }\n.workspace-recent .icon { width: 28px; height: 28px; }\n.workspace-recent .icon .glyph { width: 16px; height: 16px; }\n.workspace-ai { display: block; position: relative; background: var(--ai-bg); border: 1px solid var(--ai-line); border-radius: var(--panel-radius); padding: 22px; color: var(--accent); margin-bottom: 20px; }\n.workspace-ai > .glyph:first-child { width: 24px; height: 24px; }\n.workspace-ai h2 { font-size: 18px; line-height: 27px; margin: 14px 0 8px; font-weight: 650; }\n.workspace-ai p { font-size: 13px; line-height: 1.7; margin: 0; }\n.workspace-ai > .arrow { width: 20px; height: 20px; position: absolute; right: 20px; top: 24px; }\n.workspace-todos h3 { display: flex; justify-content: space-between; font-size: 13px; line-height: 20px; margin: 22px 0 10px; font-weight: 600; }\n.workspace-todos h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }\n.workspace-todos p { font-size: 13px; line-height: 20px; margin: 13px 0; color: var(--muted); }\n.workspace-todos .task { display: flex; justify-content: flex-end; padding: 10px 0; line-height: 20px; }\n.workspace-todos .task .glyph { width: 16px; height: 16px; }\n@media (max-width: 950px) {\n  .workspace-columns { grid-template-columns: 1fr; }\n  .workspace-columns > aside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n  .workspace-home { padding: 24px 18px; }\n}\n@media (max-width: 700px) {\n  .app-shell { grid-template-columns: 64px minmax(0, 1fr); }\n  .sidebar { padding: 12px 6px 8px; }\n  .library-brand-row { justify-content: center; }\n  .brand { flex: 0; padding: 0; }\n  .brand > span:last-child, .library-brand-row > button, .sidebar-search span, .sidebar-search kbd, .sidebar nav > a > span, .sidebar nav > button > span:last-child { display: none; }\n  .sidebar-search, .sidebar nav > a, .sidebar nav > button { justify-content: center; padding-left: 0; padding-right: 0; }\n  .sidebar nav .create-plus { display: inline-flex; }\n}\n@media (max-width: 600px) {\n  .workspace-columns > aside { grid-template-columns: 1fr; }\n  .home-tabs { gap: 18px; }\n}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"app-shell\">\n  \u003caside class=\"sidebar\">\n    \u003cdiv class=\"library-brand-row\">\u003ca class=\"brand\" href=\"#\">\u003cspan class=\"brand-symbol\">\u003csvg class=\"glyph \" aria-hidden=\"true\" viewBox=\"0    $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
