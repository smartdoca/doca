# Production-oriented single-host deployment.
# Put DOCA_ORIGIN=https://docs.example.com in .env.
# Terminate TLS in a reverse proxy and forward to 127.0.0.1:39120.
# The published image is docker.io/smartdoca/doca:0.1.7.
# `docker compose up -d` pulls that tag. Add `--build` to build from this checkout.
services:
  doca:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/smartdoca/doca:0.1.7
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DOCA_ORIGIN: "${DOCA_ORIGIN:?Set the public HTTPS origin in .env}"
      DOCA_HOST: 0.0.0.0
      DOCA_PORT: "39120"
      DOCA_DATABASE: sqlite
      DOCA_SQLITE_PATH: /data/doca.db
      DOCA_AI_SQLITE_PATH: /data/ai.db
      DOCA_UPLOAD_DIR: /data/uploads
      DOCA_DATA_DIR: /data
      DOCA_PLUGINS_DIR: "${DOCA_PLUGINS_DIR:-/data/plugins}"
      DOCA_PLUGINS_DATA_DIR: "${DOCA_PLUGINS_DATA_DIR:-/data/plugin-data}"
      DOCA_PLUGIN_NPM_REGISTRY: ${DOCA_PLUGIN_NPM_REGISTRY:-https://registry.npmjs.org}
      DOCA_PLUGIN_STORE_URL: "${DOCA_PLUGIN_STORE_URL:-https://store.smartdoca.cc}"
      DOCA_ASSET_BASE: "${DOCA_ASSET_BASE:-}"
    ports:
      - "127.0.0.1:39120:39120"
    volumes:
      - doca_data:/data

volumes:
  doca_data:
