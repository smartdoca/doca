# Production-oriented single-host deployment.
# Put the browser-facing HTTP(S) DOCA_ORIGIN in .env.
# Use a reverse proxy for HTTPS or internal HTTP; forward to 127.0.0.1:39120.
# The published image is docker.io/smartdoca/doca:0.1.17.
# `docker compose up -d` pulls that tag. Add `--build` to build from this checkout.
services:
  doca:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/smartdoca/doca:0.1.17
    pull_policy: always
    restart: unless-stopped
    init: true
    # Pinned Playwright policy permits Chromium's non-root namespace sandbox.
    # The host kernel must also allow user namespaces; never disable the sandbox.
    security_opt:
      - seccomp=./docker/chromium-seccomp.json
    shm_size: "1gb"
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DOCA_ORIGIN: "${DOCA_ORIGIN:?Set the HTTP(S) origin in .env}"
      DOCA_HOST: 0.0.0.0
      DOCA_PORT: "39120"
      DOCA_SESSION_TTL_SECONDS: "${DOCA_SESSION_TTL_SECONDS-86400}"
      DOCA_MOBILE_SESSION_TTL_SECONDS: "${DOCA_MOBILE_SESSION_TTL_SECONDS-15552000}"
      DOCA_DATABASE: "${DOCA_DATABASE:-sqlite}"
      DOCA_DATABASE_URL: "${DOCA_DATABASE_URL:-}"
      DOCA_DATABASE_POOL_MAX: "${DOCA_DATABASE_POOL_MAX:-10}"
      DOCA_WEBHOOK_DATABASE_URL: "${DOCA_WEBHOOK_DATABASE_URL:-}"
      DOCA_REDIS_URL: "${DOCA_REDIS_URL:-}"
      DOCA_REDIS_PREFIX: "${DOCA_REDIS_PREFIX:-doca}"
      DOCA_INSTANCE_ID: "${DOCA_INSTANCE_ID:-}"
      DOCA_TRUST_PROXY: "${DOCA_TRUST_PROXY:-}"
      DOCA_SQLITE_PATH: /data/doca.db
      DOCA_AI_SQLITE_PATH: /data/ai.db
      DOCA_AI_IMAGE_MAX_ATTEMPTS_PER_PAGE: "${DOCA_AI_IMAGE_MAX_ATTEMPTS_PER_PAGE-5}"
      DOCA_FILE_STORE_ID: "${DOCA_FILE_STORE_ID:?Set the shared file store ID}"
      # Local roots must refer to writable persistent mounts, such as /data/storage.
      # Development .env paths (./data/...) resolve under the image's /app directory.
      DOCA_FILE_STORES_JSON: "${DOCA_FILE_STORES_JSON:?Set file storage environment configuration}"
      DOCA_CREDENTIAL_MASTER_KEY: "${DOCA_CREDENTIAL_MASTER_KEY:?Generate a persistent key with openssl rand -hex 32 and set it in .env}"
      DOCA_DATA_DIR: /data
      DOCA_PLUGINS_DIR: "${DOCA_PLUGINS_DIR:-/data/plugins}"
      DOCA_PLUGIN_NPM_REGISTRY: ${DOCA_PLUGIN_NPM_REGISTRY:-https://registry.npmjs.org}
      DOCA_PLUGIN_STORE_URL: "${DOCA_PLUGIN_STORE_URL:-https://store.smartdoca.cc}"
      DOCA_ASSET_BASE: "${DOCA_ASSET_BASE:-}"
    ports:
      - "127.0.0.1:39120:39120"
    volumes:
      - doca_data:/data

volumes:
  doca_data:
