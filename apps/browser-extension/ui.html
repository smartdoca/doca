<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Doca</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <header>
      <button id="back" class="icon-button" hidden>
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="m14 6-6 6 6 6" />
        </svg>
      </button>
      <img src="icon.svg" width="30" height="30" alt="" />
      <div class="identity">
        <strong>Doca</strong><small id="identity">Browser Assistant</small>
      </div>
      <button id="settings" class="icon-button">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path
            d="m9 3-.6 2.2-1.7 1L4.5 6l-2 3.5L4 11v2l-1.5 1.5 2 3.5 2.2-.2 1.7 1L9 21h4l.6-2.2 1.7-1 2.2.2 2-3.5L18 13v-2l1.5-1.5-2-3.5-2.2.2-1.7-1L13 3Z"
          />
          <circle cx="11" cy="12" r="3" />
        </svg>
      </button>
    </header>
    <main>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <div id="extension-update" role="status" aria-live="polite" hidden>
        <p id="update-message"></p>
        <a
          id="update-download"
          target="_blank"
          rel="noopener noreferrer"
          data-label="updates.download"
        ></a>
      </div>
      <section id="capture-pane">
        <label class="field rule-field"
          ><span data-label="selectProfile"></span
          ><select id="profile"></select
        ></label>
        <p id="profile-detail" class="profile-detail"></p>
        <div class="capture-actions">
          <button id="capture-page" class="capture-action primary">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <path d="M3 9h18M7 6.5h.01M10 6.5h.01m-3 7h10m-10 3h7" /></svg
            ><span data-label="page"></span>
          </button>
          <button id="capture-selection" class="capture-action secondary">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
              <path
                d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m8 0h4a1 1 0 0 0 1-1v-4M8 8h8v8H8Z"
              /></svg
            ><span data-label="selection"></span>
          </button>
          <button id="open-assistant" class="capture-action ai-action">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
              <path
                d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6ZM20 2v4m-2-2h4"
              /></svg
            ><span data-label="handoff"></span
            ><svg
              class="action-arrow"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              aria-hidden="true"
            >
              <path d="m9 5 7 7-7 7" />
            </svg>
          </button>
        </div>
        <button
          id="retry"
          class="text-button wide"
          data-label="retry"
          hidden
        ></button>
        <p class="capture-help" data-label="imagesHelp"></p>
      </section>
      <section id="assistant-pane" hidden>
        <label id="assistant-profile"
          ><select id="ai-profile" aria-label="Capture profile"></select
        ></label>
        <div id="assistant-root"></div>
      </section>
      <section id="connection-pane" hidden>
        <h1 data-label="extensionSettings"></h1>
        <div class="extension-version">
          <span id="installed-version"></span>
          <button
            id="check-updates"
            type="button"
            data-label="updates.check"
          ></button>
          <p id="update-status" role="status" aria-live="polite"></p>
          <a
            id="download-page"
            target="_blank"
            rel="noopener noreferrer"
            data-label="updates.downloadPage"
            hidden
          ></a>
        </div>
        <a
          id="settings-link"
          class="rules-link"
          target="_blank"
          rel="noopener noreferrer"
          ><span data-label="manageProfiles"></span
          ><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"
            /></svg
        ></a>
        <p class="muted small" data-label="profileSettingsHelp"></p>
        <h2 id="connection-heading" data-label="notConnected"></h2>
        <p id="connection-detail" class="connection-detail"></p>
        <button id="login" class="secondary wide" data-label="login"></button>
        <form id="endpoint-form">
          <label class="field"
            ><span data-label="endpoint"></span
            ><input
              id="endpoint"
              type="url"
              placeholder="https://doca.example.com"
              required
          /></label>
          <p class="muted small" data-label="endpointHelp"></p>
          <button
            type="submit"
            class="primary wide"
            data-label="saveEndpoint"
          ></button>
        </form>
        <details id="advanced-config">
          <summary data-label="advancedConfig"></summary>
          <form id="configure">
            <label class="field"
              ><span data-label="config"></span
              ><textarea
                id="config"
                rows="5"
                spellcheck="false"
                data-placeholder="paste"
                required
              ></textarea>
            </label>
            <p class="muted small" data-label="importHelp"></p>
            <button
              class="secondary wide"
              type="submit"
              data-label="import"
            ></button>
          </form>
        </details>
        <label class="field"
          ><span data-label="locale"></span
          ><select id="locale" aria-label="Language">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select></label
        >
        <p id="shortcuts" class="muted small"></p>
        <p class="muted small" data-label="shortcutHelp"></p>
      </section>
    </main>
    <script src="select.js"></script>
    <script type="module" src="ui.js"></script>
  </body>
</html>
